<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Charcoal tile + amber tablet with a stylus, the same palette as the website. -->
  <rect width="108" height="108" rx="22" fill="#1c1b18"/>
  <!-- tablet body -->
  <rect x="26" y="34" width="56" height="40" rx="6" fill="#f0a742"/>
  <!-- screen -->
  <rect x="31" y="39" width="46" height="30" rx="3" fill="#1c1b18"/>
  <!-- desktop that spilled onto the second screen: two window bars -->
  <rect x="36" y="45" width="18" height="3" rx="1.5" fill="#f0a742" opacity=".55"/>
  <rect x="36" y="52" width="26" height="3" rx="1.5" fill="#f0a742" opacity=".35"/>
  <!-- stylus, from the lower right, tip on the screen -->
  <path d="M64.5 63.5 L82 46 a3.2 3.2 0 0 1 4.5 4.5 L69 68 L62.5 69.5 Z" fill="#ece8df"/>
  <path d="M64.5 63.5 L69 68 L62.5 69.5 Z" fill="#f0a742"/>
</svg>
