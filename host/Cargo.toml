[package]
name = "uscreen"
version = "1.2.3"
edition = "2021"
description = "Low-latency USB display server - turns your Android tablet into a second monitor"

[features]
# In-process encoding through libavcodec instead of piping raw frames into an
# ffmpeg child process. Off by default on purpose: it needs the ffmpeg
# development headers at build time, which not every distribution installs by
# default and which atomic distributions make awkward. The CLI path stays the
# supported default so the project builds anywhere.
inproc-encoder = ["ffmpeg-next"]

[dependencies]
uscreen-config = { path = "../common" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
simd-adler32 = "0.3"
sha2 = "0.10"
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.21"
toml = "0.8"

tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-next = { version = "9", optional = true }
libc = "0.2"
zbus = { version = "4", features = ["tokio"] }
# Share AccessKit's zbus 5 runtime in workspace builds. Enabling Tokio here
# makes AccessKit's dedicated async-io worker panic without a Tokio reactor.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tracing = { version = "0.1", features = ["log"] }
