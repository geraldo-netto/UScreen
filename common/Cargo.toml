[package]
name = "blent-config"
version = "1.2.3"
edition = "2021"

[features]
default = ["storage", "commands", "platform"]
storage = ["dep:tempfile"]
commands = ["dep:tempfile", "dep:tokio", "dep:libc"]
platform = ["storage", "commands", "dep:libc", "dep:clap", "dep:getrandom"]
# Preserve explicit feature selections made before the Windows extraction.
platform-linux = ["platform"]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects", "Win32_System_Memory",
    "Win32_System_Threading", "Win32_UI_Shell",
] }

[dependencies]
getrandom = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = "1"
semver = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", optional = true, features = ["process", "time", "rt", "io-util", "macros"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt"] }
