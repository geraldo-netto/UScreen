name: Cyclomatic complexity
on: [push, pull_request]
jobs:
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/complexity/requirements.txt
      - name: Test pinned metric rules (T381)
        run: python -m unittest discover -s scripts/complexity -p 'test_*.py'
      - name: Enforce maximum cyclomatic complexity of nine
        run: python scripts/complexity/check.py
