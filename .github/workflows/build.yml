name: Build Blent

on:
  workflow_dispatch:

jobs:
  build-host:
    name: Build Linux host (daemon + GUI + helper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Set up JDK for the source inventory
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check every Rust source root (T500)
        run: python3 scripts/format-rust.py --check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-0 libegl1 libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev \
            libclang-dev libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswresample-dev libswscale-dev \
            libdrm-dev rpm fakeroot ffmpeg nodejs xvfb xauth x11-utils dbus-x11 at-spi2-core libglib2.0-bin python3-xlib python3-tk python3-numpy python3-pil python3-venv
          sudo apt-get install -y libevdi-dev

      - name: Check Cinnamon cursor lifecycle (T604)
        run: python3 -m unittest discover -s scripts/tests -p test_cinnamon_cursor.py

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build daemon and GUI
        run: cargo build --release

      - name: Install coverage reporting tools (T497)
        run: |
          python3 -m venv '${{ runner.temp }}/blent-coverage-venv'
          '${{ runner.temp }}/blent-coverage-venv/bin/python' -m pip install -r scripts/coverage/requirements.txt
          cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Run both Rust configurations and enforce Linux function coverage (T497)
        run: |
          mkdir -p '${{ runner.temp }}/blent-rust-coverage'
          '${{ runner.temp }}/blent-coverage-venv/bin/python' scripts/coverage/report.py snapshot '${{ runner.temp }}/blent-rust-coverage/manifest.json'
          cargo llvm-cov --locked --workspace --lcov --output-path '${{ runner.temp }}/blent-rust-coverage/default.lcov'
          cargo llvm-cov --locked --workspace --all-features --lcov --output-path '${{ runner.temp }}/blent-rust-coverage/all-features.lcov'
          '${{ runner.temp }}/blent-coverage-venv/bin/python' scripts/coverage/rust_check.py \
            --manifest '${{ runner.temp }}/blent-rust-coverage/manifest.json' \
            --lcov '${{ runner.temp }}/blent-rust-coverage/default.lcov' \
            --lcov '${{ runner.temp }}/blent-rust-coverage/all-features.lcov' \
            --output '${{ runner.temp }}/blent-rust-coverage'

      - name: Check portable configuration policy (T371)
        run: |
          cargo test --locked --release -p blent-config --no-default-features
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p blent-config --no-default-features --target wasm32-unknown-unknown

      - name: Build EVDI helper
        run: make build-helper

      - name: Enforce per-function C capture coverage (T497)
        run: "'${{ runner.temp }}/blent-coverage-venv/bin/python' scripts/coverage/capture_check.py '${{ runner.temp }}/blent-capture-coverage'"

      - name: Enforce essential installation and packaging function coverage (T497)
        run: "'${{ runner.temp }}/blent-coverage-venv/bin/python' scripts/coverage/script_check.py '${{ runner.temp }}/blent-script-coverage'"

      - name: Preserve host coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-coverage
          path: |
            ${{ runner.temp }}/blent-capture-coverage
            ${{ runner.temp }}/blent-rust-coverage
            ${{ runner.temp }}/blent-script-coverage

      - name: Upload host binaries
        uses: actions/upload-artifact@v4
        with:
          name: blent-linux-x86_64
          path: |
            target/release/blent
            target/release/blent-gui
            host/evdi/evdi_helper

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android coverage reporting tools (T497)
        run: |
          python3 -m venv '${{ runner.temp }}/blent-coverage-venv'
          '${{ runner.temp }}/blent-coverage-venv/bin/python' -m pip install -r scripts/coverage/requirements.txt
          mkdir -p '${{ runner.temp }}/blent-android-coverage'
          '${{ runner.temp }}/blent-coverage-venv/bin/python' scripts/coverage/report.py snapshot '${{ runner.temp }}/blent-android-coverage/manifest.json'

      - name: Build debug APK and enforce Android method coverage (T497)
        run: |
          ./android/gradlew -p android -I "$PWD/scripts/coverage/android.init.gradle" lintDebug profileCoverage assembleDebug
          cp android/app/build/reports/jacoco/profileCoverage/profileCoverage.xml '${{ runner.temp }}/blent-android-coverage/jacoco.xml'
          '${{ runner.temp }}/blent-coverage-venv/bin/python' scripts/coverage/report.py check \
            --manifest '${{ runner.temp }}/blent-android-coverage/manifest.json' \
            --jacoco '${{ runner.temp }}/blent-android-coverage/jacoco.xml' \
            --scope android/app/src/main/ --output '${{ runner.temp }}/blent-android-coverage/report.json'

      - name: Preserve Android coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-coverage
          path: ${{ runner.temp }}/blent-android-coverage

      - name: Build isolated decoder replay (T458)
        run: >-
          python3 scripts/benchmarks/decoder-project.py
          --directory "${{ runner.temp }}/blent-decoder-replay"
          --package com.blent.decoderbench.candidate

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blent-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
