name: Build UScreen

on:
  push:
  pull_request:

jobs:
  build-host:
    name: Build Linux host (daemon + GUI + helper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check every Rust source root (T500)
        run: python3 scripts/format-rust.py --check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-0 libegl1 libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev \
            libclang-dev libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswresample-dev libswscale-dev \
            libdrm-dev rpm fakeroot ffmpeg xvfb xauth x11-utils dbus-x11 at-spi2-core libglib2.0-bin python3-xlib python3-tk
          sudo apt-get install -y libevdi-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build daemon and GUI
        run: cargo build --release

      - name: Run tests
        run: cargo test --release --workspace

      - name: Check portable configuration policy (T371)
        run: |
          cargo test --locked --release -p uscreen-config --no-default-features
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p uscreen-config --no-default-features --target wasm32-unknown-unknown

      - name: Test optional in-process encoder
        run: cargo test --release -p uscreen --features inproc-encoder --bin uscreen

      - name: Build EVDI helper
        run: make build-helper

      - name: Upload host binaries
        uses: actions/upload-artifact@v4
        with:
          name: uscreen-linux-x86_64
          path: |
            target/release/uscreen
            target/release/uscreen-gui
            host/evdi/evdi_helper

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Build isolated decoder replay (T458)
        run: >-
          python3 scripts/benchmarks/decoder-project.py
          --directory "${{ runner.temp }}/uscreen-decoder-replay"
          --package com.uscreen.decoderbench.candidate

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uscreen-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
