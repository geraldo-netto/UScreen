name: Windows cleanup regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p blent-config t524_cleanup_failure_still_retires_token_and_reports_failed_stop -- --nocapture
