name: Windows compilation preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-msvc:
    name: Native Windows policy and service contracts
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Preserve source bytes for native coverage fingerprints
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned stock FFmpeg for software pipe acceptance
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.7z'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'e25b682664025d49034c981afb4bae36238a40f29a3cc1c713ad9a8b5b3528f6') {
            throw 'FFmpeg archive checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'blent-ffmpeg'
          7z x $archive "-o$destination" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg extraction failed' }
          $binary = Get-ChildItem $destination -Recurse -Filter ffmpeg.exe
          if (@($binary).Count -ne 1) { throw 'Expected one FFmpeg executable' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test portable policy without platform features
        run: cargo test --locked -p blent-config --no-default-features
      - name: T631 reject the Linux camera probe on Windows
        shell: pwsh
        run: |
          $output = & cargo run --locked -p blent --example camera-feedback-probe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $output -notmatch 'requires the Linux camera backend') {
            Write-Output $output
            throw 'T631: Linux camera probe must build and explicitly reject Windows'
          }
          exit 0
      - name: Test native paths, ACLs, leases, jobs and preview applications
        # T493 security/lease tests remain mandatory; Wine cannot replace them.
        run: cargo test --locked --workspace
      - name: Build the preview with every feature selected
        # Linux libavcodec remains target-gated; this does not enable Windows capture.
        run: cargo build --locked --workspace --all-features
      - name: Install native coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Measure native Windows service contracts
        run: |
          python -c "import hashlib,json,pathlib; root=pathlib.Path('.'); paths=sorted(list(root.glob('common/src/**/*.rs'))+list(root.glob('host/src/**/*.rs'))+list(root.glob('gui/src/**/*.rs'))); pathlib.Path('windows-sources.json').write_text(json.dumps({p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},indent=2))"
          cargo llvm-cov --locked --workspace --remap-path-prefix --lcov --output-path windows-common.lcov
      - name: Preserve native counters and source revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-common-coverage-${{ github.sha }}
          path: |
            windows-common.lcov
            windows-sources.json
          if-no-files-found: warn

  cross-gnu:
    name: Linux to Windows GNU build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW linker
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: T631 compile the camera probe platform boundary
        run: cargo check --locked -p blent --example camera-feedback-probe --target x86_64-pc-windows-gnu
      - name: Link all Windows preview applications and regression executables
        run: cargo test --locked --workspace --all-features --target x86_64-pc-windows-gnu --no-run
