name: Compatibility report
description: It works (or almost works) on hardware not listed yet — tell others
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: "Describe the tested build and its limitations so this report can inform docs/compatibility.md. `uscreen doctor` supplies many details; redact tokens, serials and personal data."
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Works with a workaround (describe below)
        - Does not work
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: "Ubuntu 24.04, KDE Plasma 6.2 (Wayland)"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and encoder used
      placeholder: "AMD RX 7800, h264_vaapi"
    validations:
      required: true
  - type: input
    id: tablet
    attributes:
      label: Tablet, Android version, stylus
      placeholder: "Galaxy Tab S8, Android 14, S Pen"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UScreen version, fork commit and installation method
      placeholder: "1.2.3, commit ..., source build or package provenance"
    validations:
      required: true
  - type: textarea
    id: latency
    attributes:
      label: Latency lines, stream settings and workload (optional)
      placeholder: "Latency encode→display: p50 19.3ms p95 22.9ms"
  - type: textarea
    id: notes
    attributes:
      label: Anything else
