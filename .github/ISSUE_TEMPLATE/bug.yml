name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `blent doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Daemon log
      description: "Service: `journalctl --user -u blent -n 200`; direct GUI: `~/.local/share/blent/daemon.log`. Redact tokens, serials and personal data. Stop an existing daemon before a foreground debug run; see docs/troubleshooting.md."
      render: text
  - type: input
    id: versions
    attributes:
      label: Blent version and fork commit (host and app)
      placeholder: "Host/app 1.2.3, built from commit ..."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, desktop, GPU
      placeholder: "Bazzite 42, KDE Plasma 6 (Wayland), NVIDIA RTX 4060"
    validations:
      required: true
  - type: input
    id: tablet
    attributes:
      label: Tablet and Android version
      placeholder: "Galaxy Tab S9 Ultra, Android 14"
